[pytest]
addopts =
    -q
    --headed
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    -p no:cacheprovider
markers =
    admin: Django administration scenarios
    android: Android WebView scenarios
    api: API scenarios
    api_navigation: navigation from the storefront to the API
    authentication: authentication scenarios
    cart: shopping cart scenarios
    checkout: checkout and order scenarios
    ios: iOS WebView scenarios
    mobile: mobile application scenarios
    negative: validation and error scenarios
    regression: complete regression scenarios
    responsive: responsive layout scenarios
    reviews: product review scenarios
    security: access-control scenarios
    smoke: critical smoke scenarios
    storefront: catalog and storefront scenarios
testpaths = playwright-python
python_files = test_*.py
